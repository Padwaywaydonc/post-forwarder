name: Deploy to WordPress.org

# Fires when you publish a GitHub Release whose tag is a plain version
# number like "3.0.0" (NOT "v3.0.0"). The tag must match the plugin's
# `Stable tag:` in readme.txt and `Version:` in post-forwarder.php.
#
# The action deploys this code to the WordPress.org SVN repo, copies it to
# tags/<version>, and updates trunk — fully replacing the manual SVN steps.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SVN_USERNAME — your WordPress.org username (sylwester1213)
#   SVN_PASSWORD — your WordPress.org account password

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: post-forwarder

      - name: Upload release ZIP as build artifact
        if: steps.deploy.outputs.zip-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: post-forwarder
          path: ${{ steps.deploy.outputs.zip-path }}
